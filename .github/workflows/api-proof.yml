name: api-proof

on:
  push:
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naivolt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/naivolt_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.0
        with:
          components: clippy
      - name: Test workspace against Postgres
        run: cargo test --workspace -- --test-threads=4
      - name: Clippy the numbers API crate
        run: cargo clippy -p naivolt-api --all-targets -- -D warnings
