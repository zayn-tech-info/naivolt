[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/wallet",
    "crates/ledger",
    "crates/auth",
    "crates/devtools",
    "crates/api",
    "crates/watcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[workspace.dependencies]
# error handling
anyhow = "1"
thiserror = "2"

# money — never floats
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
rust_decimal_macros = "1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# db
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono",
    "rust_decimal", "json", "migrate",
] }

# async
tokio = { version = "1", features = ["full"] }

# crypto / wallets
bip39 = "2"
bitcoin = { version = "0.32", features = ["std", "rand"] }
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["hazmat"] }
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
bs58 = { version = "0.5", features = ["check"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
hex = "0.4"
getrandom = "0.2"
rand = "0.8"

# misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
